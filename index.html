<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Quebrar Piñata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffefd5;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #d35400;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }

    .piñata {
      font-size: 60px;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h1>🎉 Juego de Quebrar la Piñata 🎉</h1>

  <input type="text" id="nombre" placeholder="Nombre del participante">
  <br>
  <button onclick="romperPinata()">¡Romper Piñata!</button>

  <div class="piñata">🪅</div>

  <!-- Audio previo (TU ARCHIVO) -->
  <audio id="audioIntro">
    <source src="piñata - SD 480p.mov" type="video/quicktime">
  </audio>

  <script>
    function romperPinata() {
      const nombre = document.getElementById("nombre").value.trim();
      if (!nombre) {
        alert("Ingresa el nombre del participante");
        return;
      }

      const audio = document.getElementById("audioIntro");

      audio.currentTime = 0;
      audio.play();

      audio.onended = () => {
        const mensaje = `${nombre} es muy tonte, es muy tonte, se parece a su mamá`;

        const voz = new SpeechSynthesisUtterance(mensaje);
        voz.lang = "es-MX";
        voz.rate = 0.9;
        voz.pitch = 1;

        speechSynthesis.speak(voz);
      };
    }
  </script>

</body>
</html>
