<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Quebrar Piñata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffefd5;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #d35400;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 260px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }

    .piñata {
      font-size: 80px;
      margin-top: 20px;
      animation: saltar 1s infinite;
    }

    @keyframes saltar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <h1>🎉 Juego de Quebrar la Piñata 🎉</h1>

  <input type="text" id="nombre" placeholder="Nombre del participante">
  <br>
  <button onclick="romperPinata()">¡Romper Piñata!</button>

  <div class="piñata">🪅</div>

  <!-- Audio previo -->
  <audio id="audioIntro">
    <source src="pinata.mp4" type="video/mp4">
  </audio>

  <script>
    function romperPinata() {
      const nombre = document.getElementById("nombre").value.trim();
      if (!nombre) {
        alert("Ingresa el nombre del participante");
        return;
      }

      const audio = document.getElementById("audioIntro");
      audio.currentTime = 0;
      audio.play();

      audio.onended = () => {
        const mensaje = `${nombre} es muy tonte, es muy tonte, se parece a su mamá`;

        const voz = new SpeechSynthesisUtterance(mensaje);
        voz.lang = "es-MX";

        // 🎤 VOZ CARICATURA
        voz.pitch = 1.9;   // más aguda
        voz.rate = 0.75;   // más lenta
        voz.volume = 1;

        // Intentar elegir voz infantil si existe
        const voces = speechSynthesis.getVoices();
        const vozInfantil = voces.find(v =>
          v.lang.includes("es") && v.name.toLowerCase().includes("child")
        );
        if (vozInfantil) {
          voz.voice = vozInfantil;
        }

        speechSynthesis.speak(voz);
      };
    }
  </script>

</body>
</html>
