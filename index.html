<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Quebrar Piñata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffefd5;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #d35400;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 260px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }

    .piñata {
      font-size: 80px;
      margin-top: 20px;
      animation: saltar 1s infinite;
    }

    @keyframes saltar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <h1>🎉 Juego de Quebrar la Piñata 🎉</h1>

  <input type="text" id="nombre" placeholder="Nombre del participante">
  <br>
  <button onclick="romperPinata()">¡Romper Piñata!</button>

  <div class="piñata">🪅</div>

 <audio id="audioIntro" preload="auto">
  <source src="pinata.mp3" type="audio/mpeg">
</audio>


 <script>
  function romperPinata() {
    const nombre = document.getElementById("nombre").value.trim();
    if (!nombre) {
      alert("Ingresa el nombre del participante");
      return;
    }

    const audio = document.getElementById("audioIntro");

    // Forzar reproducción en iPhone
    audio.load();
    audio.currentTime = 0;

    audio.play().then(() => {
      console.log("Audio intro reproduciendo");
    }).catch(err => {
      alert("Toca nuevamente el botón para activar el audio 🔊");
      return;
    });

    audio.onended = () => {
      const mensaje = `${nombre} es muy tonto, es muy tonto, se parece a su mamá`;

      const voz = new SpeechSynthesisUtterance(mensaje);
      voz.lang = "es-MX";
      voz.pitch = 1.9;
      voz.rate = 0.75;
      voz.volume = 1;

      speechSynthesis.cancel();
      speechSynthesis.speak(voz);
    };
  }
</script>
